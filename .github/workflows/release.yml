name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # Build the tagged commit, not whatever master points at now.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          CI: true

      - name: Release
        run: npx release-it --ci --no-increment --npm.publish --github.release --git.commit=false --git.tag=false --git.push=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
